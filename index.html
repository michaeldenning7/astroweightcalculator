<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Astro Weight Calculator</title>
    <!-- Import Authentic Star Wars Logo Font -->
    <link href="https://cdnfonts.com" rel="stylesheet">
    <!-- Import Compressed Gothic Font for Dashboard UI Inputs -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Pathway+Gothic+One&display=swap" rel="stylesheet">
    <!-- Your Style Sheet -->
    <link rel="stylesheet" href="style.css">
</head>


<body>
  <div class="stars"></div>

    <h1>Astro Weight Calculator</h1>

    <!-- 3. Element for user-weight -->
    <label for="user-weight">Enter your weight (lbs):</label>
    <input type="number" id="user-weight" placeholder="e.g. 150">

    <!-- 1 & 4. Element for planets select dropdown -->
    <label for="planets">Choose a planet:</label>
    <select id="planets">
        <!-- JavaScript will populate the options here -->
    </select>

    <!-- 7. Element for calculate-button -->
    <button id="calculate-button">Calculate</button>

    <!-- 6. Element for output-area -->
    <p id="output"></p>

    <!-- Remember to link your JS file at the bottom of the body -->
    
    <canvas id="hyperspace"></canvas>
    <script src="main.js"></script>
</body>
</html>
